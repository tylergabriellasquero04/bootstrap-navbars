<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Navbars</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="morning-brew">

    <nav class="navbar navbar-expand-lg bg-light">
      <div class="py-2 container">
        <div class="mx-auto navbar-nav">
          <img
            src="morning-brew-logo.png"
            alt="Morning Brew Logo"
            class="morning-brew-logo"
          >
        </div>
      </div>
    </nav>

    <div class="navbar navbar-expand-lg bg-light sticky-top">
      <div class="container">
        <div class="mx-auto navbar-nav">

          <div class="nav-item border-1 border-top border-dark active border-3">
            <a class="nav-link" href="#">Home</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">Order Online</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">Menus</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">Locations</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">About</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">Shop</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">Contact</a>
          </div>

        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
