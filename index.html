<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Navbars</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="morning-brew">

    <nav class="navbar navbar-expand-lg bg-light">
      <div class="py-2 container">
        <div class="mx-auto navbar-nav">
          <img
            src="https://courses.ics.hawaii.edu/ics314f26/morea/ui-frameworks/experience-bootstrap-navbars-morning-brew-logo.png"
            alt="Morning Brew Logo"
            class="morning-brew-logo"
          >
        </div>
      </div>
    </nav>

    <div class="navbar navbar-expand-lg bg-light sticky-top">
      <div class="container">
        <div class="mx-auto navbar-nav morning-menu">

          <div class="nav-item border-1 border-top border-dark active border-3">
            <a class="nav-link" href="#">Home</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">Order Online</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">Menus</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">Locations</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">About</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">Shop</a>
          </div>

          <div class="nav-item border-1 border-top border-dark">
            <a class="nav-link" href="#">Contact</a>
          </div>

        </div>
      </div>
    </div>

  </div>

  <div class="container-fluid px-0 buzzs">

    <nav class="navbar navbar-expand-lg bg-gradient">
      <div class="py-3 container buzzs-nav">

        <ul class="nav justify-content-start">
          <li class="nav-item px-2">
            <h4>LUNCH</h4>
          </li>
          <li class="nav-item px-2">
            <h4>DINNER</h4>
          </li>
          <li class="nav-item px-2">
            <h4>DRINKS &amp; PUPU</h4>
          </li>
        </ul>

        <ul class="nav justify-content-center">
          <li class="nav-item">
            <img
              src="https://courses.ics.hawaii.edu/ics314f26/morea/ui-frameworks/experience-bootstrap-navbars-buzzs-logo.png"
              alt="Buzz's Original Steak House Logo"
              height="70"
            >
          </li>
        </ul>

        <ul class="nav justify-content-end">
          <li class="nav-item px-2">
            <h4>ABOUT</h4>
          </li>
          <li class="nav-item px-2">
            <h4>LOCATION</h4>
          </li>
          <li class="nav-item px-2">
            <h4>SHOP</h4>
          </li>
          <li class="nav-item px-2">
            <h4><i class="bi bi-cart"></i></h4>
          </li>
        </ul>

      </div>
    </nav>

  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>
</html>
